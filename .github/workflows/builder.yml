name: Build node-llama-cpp addons

on:
  workflow_dispatch:
  push:
    branches: [ builder, master ]

jobs:
  # =================================================================================================
  # 1. Prepare phase: Build JS and download llama.cpp source once to avoid rate limits
  # =================================================================================================
  prepare-source:
    name: Prepare Source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install modules
        run: npm ci

      - name: Build JS dist
        run: npm run build

      - name: Download latest llama.cpp release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node ./dist/cli/cli.js source download --release latest --skipBuild --noBundle --noUsageExample --updateBinariesReleaseMetadataAndSaveGitBundle

      - name: Upload build artifact (dist)
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: "build-dist"
          path: "dist"

      - name: Upload llama.cpp artifact
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          name: "llama-cpp-source"
          path: |
            llama/binariesGithubRelease.json
            llama/llama.cpp.info.json
            llama/llama.cpp
            llama/gitRelease.bundle

  # =================================================================================================
  # 2. Matrix build phase: Native C++ compilation using the source from the prepare phase
  # =================================================================================================
  build-binaries:
    name: Build - ${{ matrix.name }}
    needs: prepare-source
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "windows-cuda-1240"
            os: windows-2022
            gpu: cuda
            cuda_version: '12.4.0'
            arch: x64
          - name: "windows-cuda-1302"
            os: windows-2022
            gpu: cuda
            cuda_version: '13.0.2'
            arch: x64
          - name: "windows-vulkan"
            os: windows-2022
            gpu: vulkan
            arch: x64
          - name: "windows-no-cuda"
            os: windows-2022
            gpu: false
            arch: x64
          - name: "macos-arm64-metal"
            os: macos-14   # Using macOS 14 to avoid strict C++ errors in Xcode 16
            gpu: metal
            arch: arm64
          - name: "macos-x64-cpu"
            os: macos-14
            gpu: false
            arch: x64
          - name: "linux-cuda-1240"
            os: ubuntu-22.04
            gpu: cuda
            cuda_version: '12.4.0'
            arch: x64
          - name: "linux-cuda-1302"
            os: ubuntu-22.04
            gpu: cuda
            cuda_version: '13.0.2'
            arch: x64
          - name: "linux-vulkan"
            os: ubuntu-22.04
            gpu: vulkan
            arch: x64
          - name: "linux-no-cuda"
            os: ubuntu-22.04
            gpu: false
            arch: x64

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: build-dist
          path: dist

      - name: Download llama.cpp artifact
        uses: actions/download-artifact@v4
        with:
          name: llama-cpp-source
          path: llama

      # --- Pre-install: Setup environment and dependencies ---------------------------------------
      - name: Setup Dependencies (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          choco install cmake.install --version=4.2.1 -y
          choco install cmake --version=4.2.1 -y
          choco install ninja -y
          npm install -g cmake-js tar

      - name: Setup Dependencies (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libtbb-dev
          wget -c https://github.com/Kitware/CMake/releases/download/v4.2.1/cmake-4.2.1-linux-x86_64.tar.gz
          sudo tar --strip-components=1 -C /usr/local -xzf cmake-4.2.1-linux-x86_64.tar.gz
          npm install -g cmake-js

      - name: Setup Dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: |
          brew install cmake ninja
          npm install -g cmake-js

      - name: Install CUDA Toolkit
        if: matrix.gpu == 'cuda'
        uses: Jimver/cuda-toolkit@v0.2.30
        with:
          cuda: ${{ matrix.cuda_version }}
          method: 'network'
          use-local-cache: false

      - name: Install Vulkan SDK (Windows)
        if: matrix.gpu == 'vulkan' && startsWith(matrix.os, 'windows')
        shell: powershell
        env:
          VULKAN_VERSION: 1.4.313.2
        run: |
          curl.exe -o $env:RUNNER_TEMP/VulkanSDK-Installer.exe -L "https://sdk.lunarg.com/sdk/download/${env:VULKAN_VERSION}/windows/vulkansdk-windows-X64-${env:VULKAN_VERSION}.exe"
          & "$env:RUNNER_TEMP\VulkanSDK-Installer.exe" --accept-licenses --default-answer --confirm-command install
          Add-Content $env:GITHUB_ENV "VULKAN_SDK=C:\VulkanSDK\${env:VULKAN_VERSION}"
          Add-Content $env:GITHUB_PATH "C:\VulkanSDK\${env:VULKAN_VERSION}\bin"

      - name: Install Vulkan SDK (Ubuntu)
        if: matrix.gpu == 'vulkan' && startsWith(matrix.os, 'ubuntu')
        env:
          VULKAN_VERSION: 1.4.341.1
        run: |
          sudo apt-get update && sudo apt-get install xz-utils -y
          curl --no-progress-meter "https://sdk.lunarg.com/sdk/download/${VULKAN_VERSION}/linux/vulkan_sdk.tar.xz" -o "/opt/vulkan-sdk.tar.xz"
          mkdir -p "/opt/vulkan-sdk"
          tar -Jxf "/opt/vulkan-sdk.tar.xz" --strip-components=1 -C "/opt/vulkan-sdk"
          echo "VULKAN_SDK=/opt/vulkan-sdk/x86_64" >> $GITHUB_ENV
          echo "/opt/vulkan-sdk/x86_64/bin" >> $GITHUB_PATH

      # --- Core Compilation ----------------------------------------------------------------------
      - name: Build Binary
        shell: bash
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: |
          npm ci
          # Get exact Node.js version (e.g., 22.11.0) to ensure correct headers
          NODE_FULL_VER=$(node -v | sed 's/v//')
          node ./dist/cli/cli.js source build --ciMode --noUsageExample --arch ${{ matrix.arch }} --nodeTarget $NODE_FULL_VER --gpu ${{ matrix.gpu }}

      # --- Artifact Extraction (Only .node, .dll, .dylib, .so) -----------------------------------
      - name: Extract Binaries (Windows)
        if: startsWith(matrix.os, 'windows')
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "bins" | Out-Null
          Get-ChildItem -Path "llama\localBuilds" -Recurse -Include *.node,*.dll,*.dylib,*.so | Where-Object { $_.DirectoryName -match "Release" } | Copy-Item -Destination "bins\" -Force

      - name: Extract Binaries (Unix)
        if: "!startsWith(matrix.os, 'windows')"
        shell: bash
        run: |
          mkdir -p bins
          find llama/localBuilds -path "*/Release/*" -type f \( -name "*.node" -o -name "*.dll" -o -name "*.dylib" -o -name "*.so" \) -exec cp {} bins/ \;

      - name: Create tar.gz archive
        uses: a7ul/tar-action@v1.1.0
        with:
          command: c
          cwd: bins
          files: ./
          outPath: ${{ matrix.name }}.tar.gz

      - name: Upload binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}.tar.gz
          path: ${{ matrix.name }}.tar.gz

  # =================================================================================================
  # 3. Release phase: Collect all artifacts and create a GitHub Release
  # =================================================================================================
  create-release:
    needs: build-binaries
    runs-on: ubuntu-latest
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create timestamped Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.date.outputs.date }}
          name: node-llama-cpp builds (${{ steps.date.outputs.date }})
          body: |
            Streamlined node-llama-cpp addons (contains only .node, .dll, .so, .dylib)
            Build date: ${{ steps.date.outputs.date }}
          files: artifacts/**/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
